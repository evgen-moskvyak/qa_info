<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QA Team Lead Knowledge Base | Web & Mobile</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

    <header class="header">
        <div class="container">
            <div class="badge">Web & Mobile • Middle to Team Lead</div>
            <h1>QA Engineering & Lead Knowledge Base</h1>
            <p>Структурований довідник: від теорії та глибокого дебагу до тест-менеджменту та архітектури процесів</p>
            
            <div class="controls-wrapper">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Пошук за ключовими словами (наприклад: JOIN, Charles, DRE, Staged Rollout, OWASP)...">
                </div>
                <div class="action-buttons">
                    <button id="expandAllBtn" class="btn-secondary">Розгорнути все</button>
                    <button id="collapseAllBtn" class="btn-secondary">Згорнути все</button>
                </div>
            </div>

            <nav class="filter-tabs" id="filterTabs">
                <button class="tab-btn active" data-filter="all">Усі розділи</button>
                <button class="tab-btn" data-filter="core">Core QA & Design</button>
                <button class="tab-btn" data-filter="web-api">Web, API & Architecture</button>
                <button class="tab-btn" data-filter="mobile">Mobile Deep Dive</button>
                <button class="tab-btn" data-filter="db-sec">SQL, Debug & Security</button>
                <button class="tab-btn" data-filter="lead">Test Management & Lead</button>
            </nav>
        </div>
    </header>

    <main class="container main-content">
        <div class="stats-bar">
            <span id="topicsCounter">Завантаження тем...</span>
        </div>
        
        <!-- Сюди JS автоматично згенерує всі розділи та гармошки з файлу data.js -->
        <div id="kbContainer"></div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>Personal QA Team Lead Knowledge Base • Легко оновлюється через <code>data.js</code></p>
        </div>
    </footer>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
